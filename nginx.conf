user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Client upload limits for Avatar and OCR images (10MB)
    client_max_body_size 10M;

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Web Root for Vite React Production Build
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Client-side SPA routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }

        # =====================================================================
        # Microservice Routing: Identity & Profile Service (Port 8001)
        # =====================================================================
        location /api/v1/auth/ {
            proxy_pass http://identity-service:8001/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }

        location /api/v1/profile/ {
            proxy_pass http://identity-service:8001/api/v1/profile/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }

        location /media/ {
            proxy_pass http://identity-service:8001/media/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # =====================================================================
        # Microservice Routing: Rumour Verification Service (Port 8002)
        # =====================================================================
        location /api/v1/rumours/ {
            proxy_pass http://rumour-service:8002/api/v1/rumours/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_read_timeout 180s;
            proxy_connect_timeout 60s;
        }

        # Shared OCR input layer. Every analysis service exposes it; the
        # rumour service is the one proxied here so there is a single path.
        location /api/v1/ocr {
            proxy_pass http://rumour-service:8002/api/v1/ocr;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_read_timeout 120s;
        }

        # Backward-compatible routes
        location /v1/verify {
            proxy_pass http://rumour-service:8002/v1/verify;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_read_timeout 180s;
        }

        location /api/v1/rumor/ {
            proxy_pass http://rumour-service:8002/api/v1/rumor/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_read_timeout 180s;
        }

        # =====================================================================
        # Scam Alert Service (Port 8003)
        # =====================================================================
        # Scans are asynchronous: POST returns 202 with a scan id in a few
        # hundred ms and the client polls, so these timeouts cover the
        # request/response round trip, not the analysis itself.
        location /api/v1/scams/ {
            proxy_pass http://scam-service:8003/api/v1/scams/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_read_timeout 60s;
            proxy_connect_timeout 15s;
        }

        # =====================================================================
        # Image Check Service (Port 8004)
        # =====================================================================
        location /api/v1/images/ {
            proxy_pass http://image-service:8004/api/v1/images/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_read_timeout 60s;
            proxy_connect_timeout 15s;
            # Image uploads are larger than JSON bodies.
            client_max_body_size 12M;
            proxy_request_buffering off;
        }

        # =====================================================================
        # Per-service health, for the UI's system status panel
        # =====================================================================
        location = /api/v1/health/rumour {
            proxy_pass http://rumour-service:8002/health;
            proxy_set_header Host $host;
        }

        location = /api/v1/health/scam {
            proxy_pass http://scam-service:8003/health;
            proxy_set_header Host $host;
        }

        location = /api/v1/health/image {
            proxy_pass http://image-service:8004/health;
            proxy_set_header Host $host;
        }

        location = /api/v1/health/identity {
            proxy_pass http://identity-service:8001/health;
            proxy_set_header Host $host;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
